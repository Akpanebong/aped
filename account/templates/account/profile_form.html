{% extends 'base.html' %}
{% block title %}{{ page_title }} · APED{% endblock %}
{% block content %}<div class="form-narrow"><a href="{% url 'my_profile' %}">← My profile</a><h1 class="page-title mt-3">{{ page_title }}</h1><form method="post" class="panel p-4 mt-3">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="small text-danger">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
