{% if field.type == 'textarea' %}<textarea class="form-control" rows="2" name="{{ input_name }}" placeholder="Enter {{ field.label|lower }}"{% if field.required %} required{% endif %}>{{ field.value }}</textarea>
{% elif field.type == 'date' %}<input class="form-control" type="date" name="{{ input_name }}" value="{{ field.value }}"{% if field.required %} required{% endif %}>
{% elif field.type == 'number' %}<input class="form-control" type="number" step="any" name="{{ input_name }}" value="{{ field.value }}" placeholder="Enter value"{% if field.required %} required{% endif %}>
{% elif field.type == 'select' %}<select class="form-select" name="{{ input_name }}"{% if field.required %} required{% endif %}><option value="">Select response</option>{% for choice in field.choices %}<option value="{{ choice }}" {% if field.value == choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select>
{% elif field.type == 'linked_record' %}<select class="form-select" name="{{ input_name }}"{% if field.required %} required{% endif %}><option value="">Select linked record</option>{% for choice in field.choices %}<option value="{{ choice.0 }}" {% if field.value == choice.0 %}selected{% endif %}>{{ choice.1 }}</option>{% endfor %}</select>
{% else %}<input class="form-control" name="{{ input_name }}" value="{{ field.value }}" placeholder="Enter {{ field.label|lower }}"{% if field.required %} required{% endif %}>
{% endif %}
